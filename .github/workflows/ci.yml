# =============================================================================
#  CI：每次 push / PR 自动验证
# =============================================================================
#  跑三件事，对应"这个项目是可信的"三个层面：
#    1. 类型检查 —— 代码在类型层面是自洽的
#    2. API 测试 —— 68 项断言，其中一多半是**安全边界的攻击模拟**
#       （未登录是否被拒、A 用户能否动 B 用户的数据）
#    3. 构建 —— 前端能打包出产物
#
#  为什么这个文件对"作品集项目"特别有价值：
#    它把"我测过了"从一句口头声明变成一条可点击的绿色记录。
#    面试官不用信任你的描述，直接点进 Actions 就能看到每次提交的验证结果。
#
#  关于数据库：本项目用 SQLite，CI 里直接现建一个就行（见 db:init / db:seed），
#  不需要任何外部服务或密钥 —— 这也是选 SQLite 起步的一个额外好处。
#  以后迁移到 Postgres 时，这里要加一个 services 容器或者注入连接串的 secret。
# =============================================================================

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # 允许在 Actions 页面手动触发一次
  workflow_dispatch:

# 同一个分支连续 push 时，取消上一次还在跑的，省额度也更快看到结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 / 测试 / 构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          # 项目要求 Node >= 22.5（要用内置的 node:sqlite）并且能直接运行 .ts 文件。
          # 本地开发用的是 26，CI 用 24 验证"兼容下限附近"也能跑。
          node-version: '24'
          cache: npm

      # 用 ci 而不是 install：严格按 package-lock.json 安装，
      # 保证 CI 环境和本地、以及不同次运行之间完全一致。
      - name: 安装依赖
        run: npm ci

      # SQLite 库是"现建现用"的：CI 每次都是干净环境，
      # 这一步同时验证了"建表 + 迁移 + 灌数据"这条链路是通的。
      # 很多人只在本地跑过一次初始化脚本，上线时才发现脚本早就坏了。
      - name: 初始化数据库并灌入演示数据
        run: |
          npm run db:init
          npm run db:seed

      - name: 类型检查
        run: npm run typecheck

      # 放在构建之后：这部分测试会往演示账号里增删数据（模拟攻击和重置），
      # 而构建只读前端代码，不受数据库状态影响。
      # 顺序换过来也不会有问题，但"读操作在前、写操作在后"更好推理。
      - name: 构建前端
        run: npm run build

      - name: API 测试（含认证与越权防御）
        run: npm run test:api
